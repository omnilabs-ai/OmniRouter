[project]
# OmniRouter v2. The import package and CLI are `omni`.
# The v1 router under serverRouter/ is not part of this package; it keeps requirements.txt.
name = "omnirouter"
version = "0.0.1"
description = "OmniRouter: evidence for model swaps from your own traffic, compiled into gateway routing policies."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "omnilabs-ai" }]
dependencies = [
    "PyYAML>=6.0",
    "alembic>=1.13",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
]

[project.scripts]
omni = "omni.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The v1 router (serverRouter/, testLib/) predates these tools and is not linted; it stays as
# reference until its pieces are ported into v2 or retired, one PR at a time.
extend-exclude = ["serverRouter", "testLib", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["B008"]  # typer.Option() in parameter defaults

[tool.pytest.ini_options]
# v2 tests only; v1 tests live in testLib/ and need the v1 requirements (`pytest testLib`).
testpaths = ["tests"]
addopts = "-q -p no:warnings"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
]
